<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技图鉴 — Tech Wiki + 实时新闻</title>
<style>
  /* ── 主题变量 ── */
  :root {
    --transition-theme: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
  }
  [data-theme="dark"] {
    --bg-primary: #0a0a14;
    --bg-secondary: #12121f;
    --bg-card: rgba(22, 22, 38, 0.85);
    --bg-glass: rgba(255, 255, 255, 0.04);
    --text-primary: #f0f0f5;
    --text-secondary: #8888a0;
    --text-muted: #5a5a72;
    --accent-cyan: #00d4ff;
    --accent-purple: #8b5cf6;
    --accent-green: #34d399;
    --accent-pink: #f472b6;
    --accent-orange: #fb923c;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(0, 212, 255, 0.2);
    --shadow-cyan: 0 0 30px rgba(0, 212, 255, 0.08);
    --tag-bg: rgba(255,255,255,0.05);
    --tag-border: rgba(255,255,255,0.08);
    --tag-color: var(--text-muted);
    --card-hover-bg: rgba(255,255,255,0.02);
    --card-hover-border: rgba(0, 212, 255, 0.2);
    --news-bg: rgba(22, 22, 38, 0.85);
    --news-border: rgba(255, 255, 255, 0.08);
    --news-hover-bg: rgba(255,255,255,0.03);
    --news-empty-bg: rgba(255,255,255,0.03);
    --news-empty-border: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-hover-bg: rgba(0, 212, 255, 0.08);
    --chip-active-bg: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(139,92,246,0.15));
    --header-bg: rgba(255, 255, 255, 0.03);
    --summary-border: rgba(0, 212, 255, 0.4);
    --fact-bg: rgba(255,255,255,0.03);
    --fact-myth-bg: rgba(244, 114, 182, 0.06);
    --fact-myth-color: #f0a0b0;
    --related-tag-bg: rgba(0, 212, 255, 0.12);
    --related-tag-border: rgba(0, 212, 255, 0.3);
    --related-tag-color: var(--accent-cyan);
    --related-tag-hover-bg: rgba(0, 212, 255, 0.25);
    --theme-toggle-bg: rgba(255,255,255,0.04);
    --theme-toggle-hover-bg: rgba(255,255,255,0.08);
  }
  [data-theme="light"] {
    --bg-primary: #f5f5f7;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-glass: rgba(0, 0, 0, 0.02);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-muted: #8e8e93;
    --accent-cyan: #0071e3;
    --accent-purple: #7c3aed;
    --accent-green: #34c759;
    --accent-pink: #ff2d55;
    --accent-orange: #ff9500;
    --border-subtle: rgba(0, 0, 0, 0.08);
    --border-glow: rgba(0, 113, 227, 0.2);
    --shadow-cyan: 0 0 20px rgba(0, 113, 227, 0.1);
    --tag-bg: #f2f2f7;
    --tag-border: rgba(0, 0, 0, 0.08);
    --tag-color: var(--text-secondary);
    --card-hover-bg: rgba(0, 0, 0, 0.02);
    --card-hover-border: rgba(0, 113, 227, 0.2);
    --news-bg: #fff8e1;
    --news-border: rgba(255, 224, 178, 0.5);
    --news-hover-bg: #fff3df;
    --news-empty-bg: #f2f2f7;
    --news-empty-border: rgba(0, 0, 0, 0.12);
    --chip-bg: #f2f2f7;
    --chip-hover-bg: rgba(0, 113, 227, 0.08);
    --chip-active-bg: rgba(0, 113, 227, 0.12);
    --header-bg: rgba(255, 255, 255, 0.85);
    --summary-border: rgba(0, 113, 227, 0.5);
    --fact-bg: rgba(0, 0, 0, 0.03);
    --fact-myth-bg: rgba(255, 45, 85, 0.05);
    --fact-myth-color: #c03a4a;
    --related-tag-bg: rgba(0, 113, 227, 0.1);
    --related-tag-border: rgba(0, 113, 227, 0.25);
    --related-tag-color: var(--accent-cyan);
    --related-tag-hover-bg: rgba(0, 113, 227, 0.2);
    --theme-toggle-bg: rgba(0, 0, 0, 0.05);
    --theme-toggle-hover-bg: rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    transition: var(--transition-theme);
    position: relative;
  }

  /* 背景纹理 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(52, 211, 153, 0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.35s ease;
  }
  [data-theme="light"] body::before {
    opacity: 0.3;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    transition: opacity 0.35s ease;
  }
  [data-theme="light"] body::after {
    opacity: 0.5;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ── Header ── */
  header.app-header {
    background: var(--header-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 100;
    transition: var(--transition-theme);
  }
  .header-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    transition: var(--transition-theme);
  }
  .brand .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    transition: box-shadow 0.35s ease;
  }
  [data-theme="light"] .brand .logo {
    box-shadow: 0 0 15px rgba(0, 113, 227, 0.3);
  }
  .brand .badge {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    border-radius: 100px;
    margin-left: 0.4rem;
    transition: var(--transition-theme);
  }
  .brand .brand-sub {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.75rem;
    margin-left: 0.3rem;
    transition: var(--transition-theme);
  }

  /* ── 右侧操作区 ── */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .theme-toggle {
    background: var(--theme-toggle-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.35rem 0.5rem;
    cursor: pointer;
    color: var(--text-secondary);
    transition: var(--transition-theme), border-color 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    font-family: inherit;
  }
  .theme-toggle:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--theme-toggle-hover-bg);
  }
  .theme-toggle .toggle-icon {
    font-size: 0.85rem;
    line-height: 1;
  }

  /* ── 筛选栏 ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .filter-chip {
    background: var(--chip-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 100px;
    padding: 0.3rem 0.9rem;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    color: var(--text-secondary);
    user-select: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .filter-chip:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--chip-hover-bg);
  }
  .filter-chip.active {
    background: var(--chip-active-bg);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
  }
  .filter-chip .count {
    background: rgba(255,255,255,0.08);
    border-radius: 100px;
    padding: 0 0.4rem;
    margin-left: 0.35rem;
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: var(--transition-theme);
  }
  .filter-chip.active .count { background: rgba(0,212,255,0.2); color: var(--accent-cyan); }
  [data-theme="light"] .filter-chip .count { background: rgba(0,0,0,0.06); color: var(--text-muted); }
  [data-theme="light"] .filter-chip.active .count { background: rgba(0,113,227,0.15); color: var(--accent-cyan); }

  /* ── 新闻流 ── */
  .news-section {
    margin-top: 1.5rem;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--border-subtle);
    transition: var(--transition-theme);
  }
  .news-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.9rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .news-header h2 {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent-cyan);
    transition: var(--transition-theme);
  }
  .news-header h2 .live-dot {
    width: 7px; height: 7px;
    background: var(--accent-green);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
    box-shadow: 0 0 8px var(--accent-green);
    transition: box-shadow 0.35s ease;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .news-header .refresh-btn {
    background: var(--theme-toggle-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.35rem 0.7rem;
    font-size: 0.7rem;
    cursor: pointer;
    color: var(--text-secondary);
    transition: var(--transition-theme), border-color 0.2s, color 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .news-header .refresh-btn:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }
  .news-header .refresh-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .news_list {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .news_item {
    background: var(--news-bg);
    border: 1px solid var(--news-border);
    border-radius: 14px;
    padding: 0.7rem 0.9rem;
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    transition: all 0.25s ease;
    cursor: default;
    backdrop-filter: blur(10px);
  }
  .news_item:hover {
    border-color: var(--border-glow);
    box-shadow: var(--shadow-cyan);
    transform: translateY(-1px);
    background: var(--news-hover-bg);
  }
  .news_item .news_image {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    background: var(--bg-glass);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    border: 1px solid var(--border-subtle);
    transition: all 0.3s;
  }
  .news_item .news_image.loaded {
    border-color: transparent;
  }
  .news_item .news_image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .news_item .news_image .placeholder {
    color: var(--text-muted);
    font-size: 1.2rem;
    opacity: 0.5;
  }
  .news_item .news_body {
    flex: 1;
    min-width: 0;
  }
  .news_item .news_title-zh {
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--text-primary);
    margin-bottom: 0.15rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: var(--transition-theme);
  }
  .news_item .news_title-en {
    font-size: 0.65rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 0.25rem;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: var(--transition-theme);
  }
  .news_item .news_summary {
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-bottom: 0.3rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: var(--transition-theme);
  }
  .news_item .news_meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-size: 0.65rem;
    color: var(--text-muted);
    transition: var(--transition-theme);
  }
  .news_item .news_source {
    font-weight: 500;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: var(--transition-theme);
  }
  .news_item .news_time {
    color: var(--text-muted);
  }
  .news_item .news_tag {
    display: inline-block;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-size: 0.62rem;
    color: var(--accent-purple);
    font-weight: 500;
    margin-top: 0.25rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .news_item .news_tag:hover {
    background: rgba(139, 92, 246, 0.3);
    border-color: var(--accent-purple);
  }
  [data-theme="light"] .news_item .news_tag {
    background: rgba(124, 58, 237, 0.12);
    border-color: rgba(124, 58, 237, 0.3);
  }
  [data-theme="light"] .news_item .news_tag:hover {
    background: rgba(124, 58, 237, 0.25);
  }
  .news_item .news_tag.related {
    background: var(--related-tag-bg);
    border-color: var(--related-tag-border);
    color: var(--related-tag-color);
  }
  .news_item .news_tag.related:hover {
    background: var(--related-tag-hover-bg);
    border-color: var(--accent-cyan);
  }

  .news_empty {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-muted);
    font-size: 0.78rem;
    background: var(--news-empty-bg);
    border: 1px dashed var(--news-empty-border);
    border-radius: 14px;
    transition: var(--transition-theme);
  }

  /* ── 主内容 ── */
  main {
    margin-top: 0.5rem;
    padding-bottom: 4rem;
  }

  .category-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 1.5rem 0 0.7rem 0;
    padding-bottom: 0.35rem;
    border-bottom: 1px solid var(--border-subtle);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: var(--transition-theme);
  }
  .category-label .cat-icon {
    font-size: 0.8rem;
  }

  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .card:hover {
    border-color: var(--card-hover-border);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    background: var(--card-hover-bg);
  }
  [data-theme="light"] .card:hover {
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  }
  .card.open {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.2), var(--shadow-cyan);
  }

  .card-head {
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    user-select: none;
    transition: background 0.2s;
  }
  .card-head:hover { background: var(--card-hover-bg); }

  .card-head .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.75rem;
    color: #fff;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  [data-theme="light"] .card-head .avatar {
    border-color: rgba(0, 0, 0, 0.1);
  }
  .card-head .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-head .avatar.loaded {
    border-color: rgba(0, 212, 255, 0.3);
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
  }
  [data-theme="light"] .card-head .avatar.loaded {
    border-color: rgba(0, 113, 227, 0.4);
    box-shadow: 0 0 10px rgba(0, 113, 227, 0.2);
  }
  .card-head .avatar .avatar-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 0;
  }
  .card-head .avatar .avatar-text {
    position: relative;
    z-index: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    transition: var(--transition-theme);
  }
  [data-theme="light"] .card-head .avatar .avatar-text {
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    color: #1d1d1f;
  }
  .card-head .avatar.loaded .avatar-text { display: none; }
  .card-head .avatar.loaded .avatar-bg { opacity: 0.15; }

  .card-head .title-col { flex: 1; min-width: 0; }
  .card-head .title {
    font-weight: 600;
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-primary);
    transition: var(--transition-theme);
  }
  .card-head .sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 0.06rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--transition-theme);
  }
  .card-head .chevron {
    color: var(--text-muted);
    font-size: 0.6rem;
    transition: transform 0.25s, color 0.25s;
    flex-shrink: 0;
    margin-left: 0.3rem;
  }
  .card.open .chevron { transform: rotate(180deg); color: var(--accent-cyan); }

  .body-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease;
  }
  .card.open .body-wrap {
    max-height: 2000px;
    padding: 0 0.9rem 1rem;
  }
  .body-wrap .summary {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 0.6rem;
    line-height: 1.6;
    padding-left: 0.75rem;
    border-left: 2px solid var(--summary-border);
    transition: var(--transition-theme);
  }
  .body-wrap .meta {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
    transition: var(--transition-theme);
  }
  .body-wrap .meta .dot {
    display: inline-block;
    width: 3px; height: 3px;
    background: var(--text-muted);

const CATEGORY_COUNT = {
  founder: DATA.filter(d => d.cat === 'founder').length,
  ceo: DATA.filter(d => d.cat === 'ceo').length,
  china: DATA.filter(d => d.cat === 'china').length,

};

const filterBar = document.getElementById('filterBar');
const content = document.getElementById('content');
const newsList = document.getElementById('newsList');

const filters = [
  { id: 'all', label: '全部' },
  { id: 'founder', label: '美国创始人' },
  { id: 'ceo', label: '美国现任CEO' },
  { id: 'china', label: '中国巨头' },
  { id: 'platform', label: '平台/软件' },
  { id: 'frontier', label: '前沿动态' }
];
filters.forEach(f => {
  const el = document.createElement('div');
  el.className = 'filter-chip' + (f.id === 'all' ? ' active' : '');
  el.dataset.filter = f.id;
  const label = document.createElement('span');
  label.textContent = f.label;
  el.appendChild(label);
  if (f.id !== 'all') {
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = CATEGORY_COUNT[f.id] || 0;
    el.appendChild(count);
  }
  el.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderCards(f.id);
  });
  filterBar.appendChild(el);
});

// ─── 主题切换 ─────────────────────────────────────────────────────────────
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('tech-wiki-theme', theme);
  if (theme === 'dark') {
    themeIcon.textContent = '🌙';
    themeLabel.textContent = '夜晚';
  } else {
    themeIcon.textContent = '☀️';
    themeLabel.textContent = '白天';
  }
}

// 初始化主题
const savedTheme = localStorage.getItem('tech-wiki-theme') || 'dark';
setTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  setTheme(current === 'dark' ? 'light' : 'dark');
});

// ─── 渲染卡片 ─────────────────────────────────────────────────────────────
function renderCards(activeFilter) {
  content.innerHTML = '';
  let lastCat = null;
  let items = DATA;
  if (activeFilter !== 'all') {
    items = DATA.filter(d => d.cat === activeFilter);
  }
  if (items.length === 0) {
    content.innerHTML = '<div class="empty-state">暂无条目</div>';
    return;
  }
  items.forEach((item, idx) => {
    if (item.cat !== lastCat) {
      const cat = CATEGORY_LABEL[item.cat] || { label: item.cat, icon: '📌' };

      catLabel.className = 'category-label';
      catLabel.innerHTML = `<span class="cat-icon">${cat.icon}</span> ${cat.label}`;
      content.appendChild(catLabel);
      lastCat = item.cat;
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = item.id;

    const avatarText = (item.name.match(/[a-zA-Z]/) || [])[0] || item.name.charAt(0);
    const avatarHTML = item.isApp
      ? `<div class="avatar" style="background:linear-gradient(135deg, ${item.color}, ${adjustColor(item.color, -30)})">
           <div class="avatar-bg"></div>
           <span class="avatar-text">${item.name.split(' ')[0].charAt(0)}</span>
         </div>`
      : `<div class="avatar" data-wiki="${encodeURIComponent(item.wikiLang || 'en')}/${encodeURIComponent(item.wikiTitle || '')}" style="background:${item.color}">
           <div class="avatar-bg"></div>
           <span class="avatar-text">${avatarText}</span>
         </div>`;

    card.innerHTML = `
      <div class="card-head">
        ${avatarHTML}
        <div class="title-col">
          <div class="title">${item.name}</div>
          <div class="sub">${item.role}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="body-wrap">
        <p class="summary">${item.summary}</p>
        <p class="meta">
          <span>分类: ${item.cat === 'founder' ? '美国创始人' : item.cat === 'ceo' ? '美国现任CEO' : item.cat === 'china' ? '中国科技巨头' : item.cat === 'platform' ? '平台/软件' : '前沿动态'}</span>
          <span class="dot"></span>
          <span>更新: 2026-09</span>
        </p>
        <div class="label first">关键事实</div>
        ${item.facts.map(f => `<div class="fact">${f}</div>`).join('')}
        <div class="label">常见误解</div>

    card.querySelector('.card-head').addEventListener('click', () => {
      card.classList.toggle('open');
    });

    content.appendChild(card);

    // 加载头像
    const avatarEl = card.querySelector('.avatar[data-wiki]');
    if (avatarEl && avatarEl.dataset.wiki) {
      loadWikiAvatar(avatarEl, avatarEl.dataset.wiki);
    }
  });
}

// ─── 维基百科头像加载（多源） ──────────────────────────────────────────────
async function loadWikiAvatar(avatarEl, wikiKey) {
  const [lang, title] = wikiKey.split('/');
  const sources = [
    { url: `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=200&origin=*`, type: 'wiki' },
    { url: `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=200&origin=*`, type: 'commons' },
  ];

  for (const source of sources) {
    try {
      const resp = await fetch(source.url);
      if (!resp.ok) continue;
      const data = await resp.json();
      const pages = data.query && data.query.pages;
      if (!pages) continue;
      const pageId = Object.keys(pages)[0];
      const page = pages[pageId];
      if (page.thumbnail) {
        const imgUrl = page.thumbnail.source;
        try {
          const imgResp = await fetch(imgUrl, { method: 'HEAD' });
          if (imgResp.ok) {
            setAvatarImage(avatarEl, imgUrl);
            return;
          }
        } catch {}
      }
      if (page.original) {
        try {
          const imgResp = await fetch(page.original.source, { method: 'HEAD' });
          if (imgResp.ok) {
            setAvatarImage(avatarEl, page.original.source);
            return;
          }
        } catch {}
      }
    } catch (e) {
      console.warn('Wiki avatar fetch failed:', source.url, e);
    }
  }

  // 软件 Logo 特殊处理：从维基百科页面提取首图
  if (avatarEl.dataset.wiki && avatarEl.dataset.wiki.startsWith('en/')) {
    const title = avatarEl.dataset.wiki.split('/')[1];
    try {
      const resp = await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=images&format=json&origin=*`);
      const data = await resp.json();
      const pages = data.query && data.query.pages;
      if (pages) {
        const pageId = Object.keys(pages)[0];
        const page = pages[pageId];
        if (page.images && page.images.length > 0) {
          const imgTitle = page.images[0].title;
          const imgResp = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(imgTitle)}&prop=imageinfo&iiprop=url&format=json&origin=*`);
          const imgData = await imgResp.json();
          const imgPages = imgData.query && imgData.query.pages;
          if (imgPages) {
            const imgPageId = Object.keys(imgPages)[0];
            const imgPage = imgPages[imgPageId];
            if (imgPage.imageinfo && imgPage.imageinfo[0].url) {
              setAvatarImage(avatarEl, imgPage.imageinfo[0].url);
              return;
            }
          }
        }
      }
    } catch (e) {}
  }

  // 都失败了：保留字母 fallback
  avatarEl.classList.add('loaded');
}

function setAvatarImage(avatarEl, url) {
  avatarEl.innerHTML = `
    <img src="${url}" alt="" loading="lazy"
         onload="this.parentElement.classList.add('loaded')"
         onerror="this.parentElement.classList.remove('loaded'); this.parentElement.querySelector('.avatar-text').style.display='block'; this.parentElement.querySelector('.avatar-bg').style.opacity='0.15'">
    <div class="avatar-bg"></div>
    <span class="avatar-text" style="display:none">${avatarEl.dataset.wiki ? avatarEl.dataset.wiki.split('/')[1].charAt(0) : '?'}</span>
  `;
  const img = avatarEl.querySelector('img');
  img.onerror = function() {
    avatarEl.classList.add('loaded');
    avatarEl.innerHTML = `
      <div class="avatar-bg" style="opacity:0.15"></div>
      <span class="avatar-text">${avatarEl.dataset.wiki ? avatarEl.dataset.wiki.split('/')[1].charAt(0) : '?'}</span>
    `;
  };
  img.onload = function() {
    avatarEl.classList.add('loaded');
  };
}

// ─── 新闻流 ───────────────────────────────────────────────────────────────
async function fetchNews() {
  const results = [];

  // 1. Hacker News（官方 Firebase API，无需 CORS）
  try {
    const resp = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json?limitToFirst=15');
    const ids = await resp.json();
    if (ids && ids.length) {
      for (const id of ids.slice(0, 10)) {
        try {
          const story = await fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json?print=pretty`).then(r => r.json());
          if (story && story.title && story.url) {
            results.push({
              title: story.title,
              source: 'Hacker News',
              url: story.url,
              time: new Date(story.time * 1000).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
              score: story.score,
              desc: truncate(stripHTML(story.text || ''), 100)
            });
          }
        } catch (e) {}
      }
    }
  } catch (e) {}

  // 2. Techmeme RSS
  try {
    const resp = await fetch('https://api.allorigins.win/raw?url=https://techmeme.com/feed');
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/xml');
    const items = doc.querySelectorAll('item');
    items.forEach(item => {
      const title = item.querySelector('title')?.textContent || '';
      const link = item.querySelector('link')?.textContent || '';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const desc = item.querySelector('description')?.textContent || '';
      if (title && link) {
        results.push({
          title: title.replace(/^Techmeme: /, ''),
          source: 'Techmeme',
          url: link,
          time: pubDate ? new Date(pubDate).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '刚刚',
          score: null,
          desc: truncate(stripHTML(desc), 100)
        });
      }
    });
  } catch (e) {}

  // 3. TechCrunch RSS
  try {
    const resp = await fetch('https://api.allorigins.win/raw?url=https://techcrunch.com/feed/');
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/xml');
    const items = doc.querySelectorAll('item');
    items.forEach(item => {
      const title = item.querySelector('title')?.textContent || '';
      const link = item.querySelector('link')?.textContent || '';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const desc = item.querySelector('description')?.textContent || '';
      if (title && link) {
        results.push({
          title: title.replace(/^TechCrunch: /, ''),
          source: 'TechCrunch',
          url: link,
          time: pubDate ? new Date(pubDate).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '刚刚',
          score: null,
          desc: truncate(stripHTML(desc), 100)
        });
      }
    });
  } catch (e) {}

  // 按时间排序，去重
  results.sort((a, b) => b.time.localeCompare(a.time));
  const unique = [];
  const seen = new Set();
  for (const r of results) {
    const key = r.title.toLowerCase().slice(0, 50);
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(r);
    }
  }
  return unique.slice(0, 12);
}

function stripHTML(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function truncate(str, len) {
  if (str.length <= len) return str;
  return str.slice(0, len - 2) + '…';
}

// ─── 翻译函数 ─────────────────────────────────────────────────────────────
const translationCache = new Map();

async function translateToChinese(text) {
  if (translationCache.has(text)) {
    return translationCache.get(text);
  }
  try {
    const resp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh`);
    const data = await resp.json();
    if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
      const translated = data.responseData.translatedText;
      translationCache.set(text, translated);
      return translated;
    }
  } catch (e) {
    console.warn('Translation failed:', text, e);
  }
  // 如果翻译失败，返回原文（但标注为英文）
  translationCache.set(text, null);
  return null;
}

// ─── 新闻图片获取 ──────────────────────────────────────────────────────────
async function fetchNewsImage(url) {
  try {
    const resp = await fetch(url, { mode: 'cors' });
    if (resp.ok) {
      const html = await resp.text();
      const match = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/i);
      if (match && match[1]) {
        try {
          const imgResp = await fetch(match[1], { method: 'HEAD' });
          if (imgResp.ok && imgResp.headers.get('content-type')?.startsWith('image/')) {
            return match[1];
          }
        } catch {}
      }
      const imgMatch = html.match(/<img[^>]+src=["']([^"']+\.(?:png|jpg|jpeg|gif|webp))["']/i);
      if (imgMatch && imgMatch[1]) {
        try {
          const imgResp = await fetch(imgMatch[1], { method: 'HEAD' });
          if (imgResp.ok) return imgMatch[1];
        } catch {}
      }
    }
  } catch (e) {
    try {
      const proxyResp = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
      const html = await proxyResp.text();
      const match = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/i);
      if (match && match[1]) {
        return match[1];
      }
      const imgMatch = html.match(/<img[^>]+src=["']([^"']+\.(?:png|jpg|jpeg|gif|webp))["']/i);
      if (imgMatch && imgMatch[1]) {
        return imgMatch[1];
      }
    } catch (e2) {}
  }
  return null;
}

// ─── 颜色工具 ─────────────────────────────────────────────────────────────
function adjustColor(hex, amount) {
  if (!hex || hex.length < 6) return hex;
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0x00FF) + amount;
  let b = (num & 0x0000FF) + amount;
  r = Math.min(255, Math.max(0, r));
  g = Math.min(255, Math.max(0, g));
  b = Math.min(255, Math.max(0, b));
  return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
}

function findRelatedTags(title) {
  const tags = [];
  const lower = title.toLowerCase();
  for (const [keyword, ids] of Object.entries(NEWS_RELATED)) {
    if (lower.includes(keyword.toLowerCase())) {
      for (const id of ids) {
        if (!tags.includes(id)) tags.push(id);
      }
    }
  }
  return tags;
}

async function renderNews(newsItems) {
  newsList.innerHTML = '';
  if (!newsItems || newsItems.length === 0) {
    newsList.innerHTML = '<div class="news_empty">暂无新闻数据</div>';
    return;
  }

  const translationPromises = newsItems.map(async (item) => {
    const translatedTitle = await translateToChinese(item.title);
    item.translatedTitle = translatedTitle;
    return item;
  });

  const translatedItems = await Promise.all(translationPromises);

  for (const item of translatedItems) {
    const div = document.createElement('div');
    div.className = 'news_item';

    const relatedTags = findRelatedTags(item.title);

    div.innerHTML = `
      <div class="news_image" id="newsImg_${item.title.replace(/[^a-zA-Z0-9]/g, '')}">
        <span class="placeholder">📰</span>
      </div>
      <div class="news_body">
        <div class="news_title-zh">${item.translatedTitle || item.title}</div>
        ${item.translatedTitle ? `<div class="news_title-en">${item.title}</div>` : ''}
        ${item.desc ? `<div class="news_summary">${item.desc}</div>` : ''}
        <div class="news_meta">
          <span class="news_source">${item.source}</span>
          <span class="news_time">${item.time}</span>
          ${item.score ? `<span>· ${item.score} 分</span>` : ''}
        </div>
        ${relatedTags.map(id => {
          const data = DATA.find(d => d.id === id);
          if (data) return `<span class="news_tag related" data-jump="${id}">→ ${data.name}</span>`;
        }).join('')}
      </div>
    `;
    newsList.appendChild(div);

    // 加载新闻图片
    const imgContainer = div.querySelector('.news_image');
    const imageUrl = await fetchNewsImage(item.url);
    if (imageUrl) {
      imgContainer.innerHTML = `<img src="${imageUrl}" alt="" loading="lazy"
        onload="this.parentElement.classList.add('loaded')"
        onerror="this.parentElement.innerHTML='<span class=\'placeholder\'>📰</span>'">`;
    } else {
      const iconMap = {
        'Hacker News': '💻',
        'Techmeme': '🔥',
        'TechCrunch': '🚀'
      };
      imgContainer.innerHTML = `<span class="placeholder">${iconMap[item.source] || '📰'}</span>`;
    }
  }

  // 绑定相关标签点击 → 跳转到卡片
  document.querySelectorAll('.news_tag.related').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.jump;
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => card.classList.add('open'), 300);
      }
    });
  });
}

async function refreshNews() {
  const spinner = document.getElementById('newsSpinner');
  const label = document.getElementById('refreshLabel');
  spinner.style.display = 'inline-block';
  label.textContent = '加载中…';
  label.disabled = true;

  newsList.innerHTML = '<div class="news_empty">加载新闻中…</div>';
  try {
    const items = await fetchNews();
    await renderNews(items);
  } catch (e) {
    newsList.innerHTML = '<div class="news_empty">新闻加载失败，请刷新重试</div>';
    console.error('News fetch error:', e);
  }
  spinner.style.display = 'none';
  label.textContent = '↻ 刷新';
  label.disabled = false;
}

document.getElementById('refreshNews').addEventListener('click', refreshNews);
