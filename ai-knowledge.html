<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 知识脉络 · 五讲交互地图</title>
<style>
:root{
  --bg:#0b1020;
  --bg2:#101830;
  --panel:#121a33;
  --card:#182244;
  --card2:#1d2954;
  --line:#26325a;
  --text:#edf2ff;
  --muted:#9daed6;
  --accent:#5b8cff;
  --accent2:#36e0c4;
  --warn:#ffc857;
  --pink:#ff6d9f;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#f3f6fd;
  --bg2:#eef2fb;
  --panel:#ffffff;
  --card:#ffffff;
  --card2:#f2f6ff;
  --line:#dce4f5;
  --text:#16203a;
  --muted:#5d6c8f;
  --accent:#3366ff;
  --accent2:#0aa88b;
  --warn:#c98a00;
  --pink:#e04478;
  --shadow:0 12px 32px rgba(30,50,110,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;overflow:hidden;
  display:flex;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent)}

/* ===== 侧边栏 ===== */
aside{
  width:302px;min-width:302px;height:100vh;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  z-index:5;
}
.brand{padding:18px 18px 12px}
.brand h1{font-size:21px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand h1 .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 0 14px var(--accent)}
.brand p{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}
.search-wrap{padding:0 14px 12px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
.progress-wrap{padding:0 16px 14px}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease}
.points-line{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:13px;color:var(--muted)}
.points-line b{color:var(--warn);font-size:17px;font-weight:800}
.points-line.bump b{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45);color:var(--accent2)}100%{transform:scale(1)}}
.tree{flex:1;overflow-y:auto;padding:0 10px 20px}
.tree::-webkit-scrollbar{width:8px}
.tree::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.chapter{margin-bottom:4px}
.chapter-head{display:flex;align-items:center;gap:8px;padding:10px 9px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.chapter-head:hover{background:var(--card)}
.chapter-head .ico{font-size:16px}
.chapter-head .n{font-size:11px;color:var(--muted);font-weight:400}
.chapter-items{display:none;margin:2px 0 6px 14px;padding-left:10px;border-left:2px solid var(--line)}
.chapter.open .chapter-items{display:block}
.item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.item:hover{background:var(--card);color:var(--text)}
.item.active{background:var(--card2);color:var(--text);font-weight:600}
.item .tick{margin-left:auto;color:var(--accent2);font-size:11px;opacity:0}
.item.visited .tick{opacity:1}

/* ===== 主区域 ===== */
main{flex:1;height:100vh;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;transition:.2s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#map{flex:1;width:100%;cursor:grab;background:
  radial-gradient(1200px 700px at 50% 35%,rgba(91,140,255,.12),transparent 60%),
  radial-gradient(800px 500px at 80% 70%,rgba(255,109,159,.08),transparent 55%),
  var(--bg)}
#map:active{cursor:grabbing}
.node{cursor:pointer}
.node circle{transition:stroke .2s,r .2s,filter .2s}
.node:hover circle{filter:drop-shadow(0 0 10px currentColor)}
.node text{pointer-events:none;user-select:none}
.node .lbl{font-size:15px;fill:var(--text);font-weight:700}
.node .emoji{font-size:21px}
.node.branch .lbl{font-size:17px}
.node.branch .emoji{font-size:27px}
.node.root .lbl{font-size:19px}
.node.root .emoji{font-size:34px}
.node.dim{opacity:.12;pointer-events:none}
.node.match{opacity:1}
.node.match circle{stroke:var(--warn)!important;stroke-width:3px}
.edge{fill:none;stroke:var(--line);stroke-width:1.4;opacity:.8}
.edge.hl{stroke:var(--accent);stroke-width:2.6;opacity:1;filter:drop-shadow(0 0 6px var(--accent))}
.edge.dim{opacity:.08}

/* 详情面板 */
.detail{
  position:fixed;top:0;right:0;width:390px;max-width:92vw;height:100vh;background:var(--panel);
  border-left:1px solid var(--line);z-index:20;transform:translateX(105%);transition:transform .3s ease;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.detail.show{transform:translateX(0)}
.detail .close{align-self:flex-end;margin:14px 16px 0;width:34px;height:34px;border-radius:50%;background:var(--card);font-size:17px;color:var(--muted)}
.detail .close:hover{color:var(--text)}
.detail-body{padding:6px 22px 30px;overflow-y:auto}
.detail-head{display:flex;gap:14px;align-items:flex-start;margin-top:8px}
.detail-head .ico{font-size:40px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.detail-head h2{font-size:21px;line-height:1.35;margin-bottom:6px}
.detail-head .tag{font-size:12px;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:var(--text)}
.points{margin:16px 0}
.points h3{font-size:13px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.points ul{list-style:none}
.points li{padding:9px 12px;border-left:3px solid var(--accent2);background:var(--card);border-radius:8px;margin-bottom:8px;font-size:13.5px;line-height:1.7}
.fun{margin-top:16px;background:linear-gradient(135deg,rgba(91,140,255,.12),rgba(54,224,196,.10));border:1px solid rgba(91,140,255,.35);border-radius:14px;padding:14px 16px}
.fun h3{font-size:13px;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.fun p{font-size:14px;line-height:1.8;font-style:italic}
.passed-badge{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(54,224,196,.12);border:1px solid rgba(54,224,196,.4);color:var(--accent2);font-size:13px;text-align:center;font-weight:700}
.check-btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(4,8,20,.66);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-card{width:620px;max-width:94vw;max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.modal-card h2{font-size:20px;margin-bottom:6px}
.modal-card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.q{padding:14px 16px;border-radius:12px;background:var(--card);font-size:15px;line-height:1.7;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{padding:12px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:14px;line-height:1.6;transition:.15s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt.correct{background:rgba(54,224,196,.16);border-color:var(--accent2);color:var(--accent2)}
.opt.wrong{background:rgba(255,109,159,.14);border-color:var(--pink);color:var(--pink)}
.opt:disabled{opacity:.8;cursor:default}
.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.score-big{font-size:34px;font-weight:800;color:var(--accent)}
.btn{padding:10px 18px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.hint{font-size:13px;color:var(--muted)}
.tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card2);font-size:13px;color:var(--muted);line-height:1.6}

/* 奖励弹窗 */
.reward{position:fixed;inset:0;background:rgba(4,8,20,.66);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.reward.show{display:flex}
.reward-card{width:480px;max-width:94vw;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 28px 26px;text-align:center;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.reward-emoji{font-size:56px;line-height:1;margin-bottom:10px}
.reward-title{font-size:21px;font-weight:800;margin-bottom:6px}
.reward-pts{color:var(--accent2);font-weight:800;font-size:15px;margin-bottom:14px}
.reward-quote{font-size:18px;line-height:1.9;font-style:italic;color:var(--text);background:var(--card);border-radius:14px;padding:16px 18px;margin:14px 0 8px}
.reward-src{font-size:12px;color:var(--muted);margin-bottom:18px}
.confetti{position:fixed;top:-16px;width:9px;height:15px;border-radius:2px;z-index:61;pointer-events:none;animation:fall 2.3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.15}}

@media (max-width:820px){
  body{flex-direction:column}
  aside{width:100%;min-width:0;height:auto;max-height:40vh;border-right:none;border-bottom:1px solid var(--line)}
  .tree{max-height:24vh}
  main{height:60vh}
  .detail{width:100vw}
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1><span class="dot"></span>AI 知识脉络</h1>
    <p>由 5 份《人工智能》讲义提炼的交互地图<br>点击节点探索 · 拖动地图 · 滚轮缩放</p>
  </div>
  <div class="search-wrap">
    <input id="search" class="search" type="text" placeholder="搜索概念，如：损失函数 / Attention / YOLO…">
  </div>
  <div class="progress-wrap">
    <div class="progress-top"><span>探索进度</span><span id="progText">0 / 0</span></div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="points-line"><span>⭐ 学习积分</span><b id="pointsVal">0</b></div>
  </div>
  <nav id="tree" class="tree"></nav>
</aside>

<main>
  <div class="topbar">
    <button class="pill" id="btnFit" title="回到全景">🎯 全景</button>
    <button class="pill" id="btnTheme" title="切换主题">🌗 主题</button>
    <button class="pill" id="btnQuiz" title="随机测验">⚡ 小测验</button>
    <div class="spacer"></div>
    <button class="pill" id="btnReset" title="重置已学进度">↺ 重置进度</button>
  </div>
  <svg id="map" aria-label="AI知识脉络图"></svg>
</main>

<div id="detail" class="detail">
  <button class="close" id="detailClose">✕</button>
  <div class="detail-body" id="detailBody"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<div id="reward" class="reward">
  <div class="reward-card" id="rewardCard"></div>
</div>

<div id="nodeQuiz" class="modal">
  <div class="modal-card" id="nodeQuizCard"></div>
</div>

<script>
const SVG_NS='http://www.w3.org/2000/svg';
const DATA=[
{id:'c1',label:'机器学习基础',icon:'🧠',color:'#5b8cff',tag:'第一讲 · 基础引擎',
 summary:'像学渣逆袭一样，AI 不背规则，而是从数据里总结出解题套路。',
 fun:'老师金句：w 怎么找？猜！！！消耗算力。',
 children:[
  {id:'c1-1',label:'机器学习',icon:'🎓',tag:'核心概念',
   summary:'无需明确编程所有规则，从经验中学习，获得识别规律的能力。',
   points:['训练样本 → 模型（解题套路）→ 目标函数（衡量对错）→ 优化算法（调整参数）','相关数学：线性代数、求偏导、概率论'],
   fun:'流行就一定是好的吗？多问问。'},
  {id:'c1-2',label:'数据',icon:'📊',tag:'数据是燃料',
   summary:'一组个体（样本）的特征和结果，用矩阵表示。',
   points:['样本 = 特征（输入）+ 标签（结果）','n 行 = n 个样本，d 列 = d 个特征','图像 = 三层 RGB 矩阵叠加'],
   fun:'数据并不客观，反映的是人类历史的偏见和局限性。'},
  {id:'c1-3',label:'三大数据集',icon:'📝',tag:'数据划分',
   summary:'平时作业、模拟考、高考，模型也要经历这三关。',
   points:['训练集 70%：给 x、y，用来“学”出模型','验证集 20%：只给 x 看，用来“选”模型、调方法','测试集 10%：最终检验性能，考前绝不留一手'],
   fun:'高考式学习法：训练=刷题，验证=模考，测试=高考。'},
  {id:'c1-4',label:'模型',icon:'🧩',tag:'函数映射',
   summary:'把输入映射到输出的计算规则，本质是一个函数。',
   points:['训练 = 把参数 w 找出来','单神经元：Z = wx + b','多层神经元 = 深度学习；越接近 y 越抽象，越接近 x 越原始'],
   fun:'AI 是黑箱：找到 w 的过程，你根本不知道。'},
  {id:'c1-5',label:'损失函数',icon:'🎯',tag:'评价标准',
   summary:'衡量预测和真实答案差多远，越小越好。',
   points:['回归常用平方误差：可导、惩罚大误差','分类用交叉熵：衡量预测分布和真实分布的距离'],
   fun:'损失函数和你的成绩单一样，越看越想让数字变小。'},
  {id:'c1-6',label:'过拟合',icon:'🛡️',tag:'泛化能力',
   summary:'死记硬背训练集，一到新题就翻车。',
   points:['防过拟合①：验证集 + 提早停止训练','防过拟合②：数据增强，做随机变换与扰动，让模型“见多识广”'],
   fun:'只会背答案 ≠ 学会知识。'},
  {id:'c1-7',label:'优化算法',icon:'🧭',tag:'参数寻优',
   summary:'用偏导找方向，把损失一步步压小。',
   points:['求偏导：z=x+y，对 x 求导时 y 也当变量处理','超参数：人为设定，不是模型学出来的'],
   fun:'调参如炼丹，方向比努力更重要。'}
 ]},
{id:'c2',label:'三种学习范式',icon:'🎓',color:'#36e0c4',tag:'第二讲 · 怎么学',
 summary:'有答案、没答案、靠自己试错，AI 的三条学习路线。',
 fun:'老师金句：技术是世界上最不值钱的东西，值钱的是解决方案、思路和结论。',
 children:[
  {id:'c2-1',label:'有监督学习',icon:'🏷️',tag:'给答案',
   summary:'给特征和标签，学会从特征预测标签。',
   points:['x = 特征，y = 标签','挑战：标注成本高、泛化能力差'],
   fun:'你填过的验证码，其实都在给模型免费打工。'},
  {id:'c2-2',label:'无监督学习',icon:'🔍',tag:'自己找规律',
   summary:'没有标签，模型自己找规律分类。',
   points:['构造目标函数，间接定义“什么是好”','离线学习：只从固定数据学模式','在线学习：接收新数据更新，但不主动影响环境'],
   fun:'抖音给你分类：分得越干净越好。'},
  {id:'c2-3',label:'强化学习',icon:'🎮',tag:'试错学习',
   summary:'不告诉对错细节，只给奖励和惩罚。',
   points:['核心思想：试错，奖励更多、惩罚更少','目标函数：长期总奖励最大化','马尔可夫性：未来只取决于当前状态，与历史路径无关'],
   fun:'像训练宠物：做对了给零食，做错了轻轻拍。'},
  {id:'c2-4',label:'线性网络',icon:'📈',tag:'单层模型',
   summary:'线性回归就是单层神经网络。',
   points:['决定系数越小越好','随机种子：让数据划分、初始化可复现'],
   fun:'最简单的模型，也有身份证（随机种子）。'},
  {id:'c2-5',label:'Softmax',icon:'☝️',tag:'单选分类',
   summary:'单标签多分类，把得分压成概率。',
   points:['所有概率之和 = 1','越接近 0，损失越大'],
   fun:'单选题：这是裤子、衣服还是帽子？只能选一个。'},
  {id:'c2-6',label:'Sigmoid',icon:'✌️',tag:'多选分类',
   summary:'多标签分类，每个得分单独映射到 0-1。',
   points:['类别间独立、互不干扰','各过各的，概率和没有限制'],
   fun:'多选题：图里有没有人？有没有狗？有没有草地？'}
 ]},
{id:'c3',label:'深度网络',icon:'🕸️',color:'#ff9f43',tag:'第三讲 · 为什么变深',
 summary:'加隐藏层、掰弯空间，让网络看到更抽象的特征。',
 fun:'老师金句：我们永远都是长期主义者。',
 children:[
  {id:'c3-1',label:'上节回顾',icon:'🔁',tag:'温故',
   summary:'线性回归、Softmax、Sigmoid 的输出差异。',
   points:['线性回归：直接把 z 当预测值','Softmax：把 z 压缩到 0-1 表示概率','Sigmoid：把多个 z 转成多个类别概率'],
   fun:'先会走路，再学跑步。'},
  {id:'c3-2',label:'MLP',icon:'🥪',tag:'多层感知机',
   summary:'输入层 → 隐藏层 → 输出层，多一层非线性加工。',
   points:['单层只能看一堆像素，看不到抽象特征','隐藏层：加工、提取、组合特征','层数一多，参数量史诗级增加'],
   fun:'隐藏层不是故意藏起来，只是不直接对应最终答案。'},
  {id:'c3-3',label:'激活函数',icon:'🌀',tag:'非线性',
   summary:'“掰弯空间”，让网络能画复杂分类边界。',
   points:['多层网络反复拉伸掰弯空间','特征工程依赖专家直觉或暴力组合'],
   fun:'空间掰弯了，世界就分开了。'},
  {id:'c3-4',label:'通用逼近',icon:'🌌',tag:'理论保证',

  document.getElementById('nodeQuiz').classList.add('show');
}
function startNodeQuestion(){
  const n=quizNode, q=NODE_QUIZ[n.id];
  const card=document.getElementById('nodeQuizCard');
  card.innerHTML=`<h2>📝 学习成果检验</h2><div class="sub">「${n.label}」</div>
    <div class="q">${q.q}</div><div class="opts" id="nodeOpts"></div>
    <div class="tip" id="nodeTip" style="display:none"></div>
    <div class="modal-foot"><span class="hint">答对才能获得积分</span><button class="btn ghost" onclick="closeNodeQuiz()">稍后再答</button></div>`;
  const opts=document.getElementById('nodeOpts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.textContent=String.fromCharCode(65+i)+'. '+o;
    b.onclick=()=>answerNode(i,b);
    opts.appendChild(b);
  });
}
function answerNode(i,btn){
  const n=quizNode, q=NODE_QUIZ[n.id];
  const all=document.querySelectorAll('#nodeOpts .opt');
  all.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');});
  const tip=document.getElementById('nodeTip'); tip.style.display='block';
  if(i===q.a){
    btn.classList.add('correct'); tip.innerHTML='✅ 答对了！'+q.tip;
    const firstPass=!passed.has(n.id);
    if(firstPass){passed.add(n.id);localStorage.setItem('ai-map-passed',JSON.stringify([...passed]));addPoints(LEARN_PTS);updateProgress();renderTree();showDetail(n);}
    setTimeout(()=>{closeNodeQuiz();afterNodeCorrect(n,firstPass);},900);
  }else{
    btn.classList.add('wrong'); tip.innerHTML='❌ 再想想：'+q.tip;
    setTimeout(()=>startNodeQuestion(),1100);
  }
}
function afterNodeCorrect(n,firstPass){
  if(!firstPass)return;
  const branch=DATA.find(b=>b.children.some(c=>c.id===n.id));
  if(branch && !completed.has(branch.id) && branch.children.every(c=>passed.has(c.id))){
    completed.add(branch.id);localStorage.setItem('ai-map-chapters',JSON.stringify([...completed]));addPoints(CHAPTER_PTS);
    showReward({emoji:'🎓',title:`通关「${branch.label}」`,pts:LEARN_PTS+CHAPTER_PTS,quote:pickQuote(),sub:`知识点 +${LEARN_PTS} · 章节通关 +${CHAPTER_PTS}`});
  }else{
    showReward({emoji:'⭐',title:`答对了！「${n.label}」`,pts:LEARN_PTS,quote:pickQuote(),sub:'学习积分 +'+LEARN_PTS});
  }
}
function closeNodeQuiz(){document.getElementById('nodeQuiz').classList.remove('show');}
document.addEventListener('click',e=>{if(e.target.id==='reward')closeReward();});
if(localStorage.getItem('ai-map-theme')==='light') document.documentElement.setAttribute('data-theme','light');

function build(){
  flat=[root]; nodeMap={}; root.level=0;
  DATA.forEach(b=>{b.level=1; b.children.forEach(c=>{c.level=2; flat.push(c);}); flat.push(b);});
  flat.forEach(n=>nodeMap[n.id]=n);
  layout();
  renderTree(); renderGraph(); fit();
  updateProgress();
  renderPoints();
}
function layout(){
  root.x=0; root.y=0;
  const R1=215, R2=432;
  const total=DATA.reduce((s,b)=>s+b.children.length,0);
  const GAP=0.12, span=Math.PI*2-GAP;
  let cursor=-Math.PI/2+GAP/2;
  DATA.forEach((b)=>{
    const m=b.children.length;
    const sector=(m/total)*span;
    const angles=[];
    b.children.forEach((c,j)=>{
      const a=cursor+sector*(j+0.5)/m;
      angles.push(a);
      c.x=Math.cos(a)*R2; c.y=Math.sin(a)*R2;
    });
    const ba=(angles[0]+angles[angles.length-1])/2;
    b.x=Math.cos(ba)*R1; b.y=Math.sin(ba)*R1;
    cursor+=sector;
  });
}
function edgePath(a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
}
function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  DATA.forEach(b=>{
    const sec=document.createElement('div'); sec.className='chapter open'; sec.id='chap-'+b.id;
    sec.innerHTML=`<div class="chapter-head"><span class="ico">${b.icon}</span><span>${b.label}</span><span class="n">${b.children.length} 概念</span></div><div class="chapter-items"></div>`;
    const items=sec.querySelector('.chapter-items');
    b.children.forEach(c=>{
      const it=document.createElement('div'); it.className='item'; it.id='item-'+c.id;
      it.innerHTML=`<span>${c.icon}</span><span>${c.label}</span><span class="tick">✓</span>`;
      if(passed.has(c.id)) it.classList.add('visited');
      if(c.id===selectedId) it.classList.add('active');
      it.onclick=()=>select(c.id);
      items.appendChild(it);
    });
    sec.querySelector('.chapter-head').onclick=()=>sec.classList.toggle('open');
    tree.appendChild(sec);
  });
}
function renderGraph(){
  edgesLayer.innerHTML=''; nodesLayer.innerHTML=''; edgeEls={};
  DATA.forEach(b=>{
    addEdge(root,b);
    b.children.forEach(c=>addEdge(b,c));
  });
  flat.forEach(n=>{
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','node'+(n.level?'':' root'));
    if(n.level===1) g.setAttribute('class','node branch');
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    const r=n.level===0?56:n.level===1?42:30;
    const fill=n.level===0?'#182244':n.color;
    g.innerHTML=`<circle r="${r}" fill="${fill}" stroke="${n.color}" stroke-width="${n.level===0?3:2.4}" fill-opacity="${n.level===0?1:.20}" style="color:${n.color}"></circle>
      <text class="emoji" y="2" text-anchor="middle" dominant-baseline="central">${n.icon}</text>
      <text class="lbl" y="${r+19}" text-anchor="middle">${n.label}</text>`;
    if(passed.has(n.id) && n.level===2){
      const t=document.createElementNS(SVG_NS,'text');
      t.setAttribute('class','emoji'); t.setAttribute('x',r-2); t.setAttribute('y',-r+4); t.setAttribute('font-size','12'); t.textContent='✓';
      g.appendChild(t);
    }
    g.addEventListener('click',e=>{e.stopPropagation();select(n.id);});
    makeDraggable(g,n);
    nodesLayer.appendChild(g); nodeEls[n.id]=g;
  });
}
function addEdge(a,b){
  const p=document.createElementNS(SVG_NS,'path');
  p.setAttribute('d',edgePath(a,b)); p.setAttribute('class','edge');
  edgesLayer.appendChild(p); edgeEls[a.id+'>'+b.id]=p;
}
function updateGraph(){
  flat.forEach(n=>{
    const g=nodeEls[n.id]; if(!g) return;
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
  });
  Object.keys(edgeEls).forEach(k=>{
    const [a,b]=k.split('>');
    edgeEls[k].setAttribute('d',edgePath(nodeMap[a],nodeMap[b]));
  });
}
function applyView(){
  viewport.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
}
function fit(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  flat.forEach(n=>{
    const m=n.level===0?105:n.level===1?85:60;
    if(n.x-m<minX)minX=n.x-m;
    if(n.x+m>maxX)maxX=n.x+m;
    if(n.y-m<minY)minY=n.y-m;
    if(n.y+m>maxY)maxY=n.y+m;
  });
  const w=svg.clientWidth,h=svg.clientHeight,pad=46;
  const k=Math.min((w-pad)/(maxX-minX||1),(h-pad)/(maxY-minY||1),1.35);
  view.k=k; view.x=w/2-(minX+maxX)/2*k; view.y=h/2-(minY+maxY)/2*k;
  applyView();
}
function clientToWorld(cx,cy){
  const r=svg.getBoundingClientRect();
  return {x:(cx-r.left-view.x)/view.k, y:(cy-r.top-view.y)/view.k};
}
function makeDraggable(g,n){
  g.addEventListener('mousedown',e=>{
    if(e.button!==0) return; e.stopPropagation();
    const start=clientToWorld(e.clientX,e.clientY);
    const sx=n.x,sy=n.y;
    function mm(ev){const p=clientToWorld(ev.clientX,ev.clientY);n.x=sx+p.x-start.x;n.y=sy+p.y-start.y;updateGraph();}
    function mu(){window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);}
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
  });
}
svg.addEventListener('mousedown',e=>{
  if(e.target!==svg) return;
  const sx=e.clientX,sy=e.clientY,vx=view.x,vy=view.y;
  function mm(ev){view.x=vx+ev.clientX-sx;view.y=vy+ev.clientY-sy;applyView();}
  function mu(){window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);}
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const wx=(mx-view.x)/view.k, wy=(my-view.y)/view.k;
  const f=e.deltaY<0?1.1:1/1.1;
  view.k=Math.min(3,Math.max(.2,view.k*f));
  view.x=mx-wx*view.k; view.y=my-wy*view.k;
  applyView();
},{passive:false});

function select(id){
  const n=nodeMap[id]; if(!n) return;
  selectedId=id;
  if(n.level===2 && !visited.has(id)){
    visited.add(id);
    localStorage.setItem('ai-map-visited',JSON.stringify([...visited]));
  }
  renderTree(); renderGraph();
  flat.forEach(x=>{
    if(!nodeEls[x.id]) return;
    const c=nodeEls[x.id].querySelector('circle');
    c.setAttribute('stroke-width', x.id===id?4:2.2);
    if(x.level) c.setAttribute('fill-opacity', x.id===id?0.55:0.18);
  });
  showDetail(n);
  document.getElementById('detail').classList.add('show');
}
function showDetail(n){
  const body=document.getElementById('detailBody');
  const pts=(n.points||[]).map(p=>`<li>${p}</li>`).join('');
  body.innerHTML=`
    <div class="detail-head">
      <div class="ico">${n.icon}</div>
      <div><h2>${n.title||n.label}</h2><span class="tag">${n.tag||'核心概念'}</span></div>
    </div>
    <div class="summary">${n.summary||''}</div>
    ${n.level===2?(passed.has(n.id)?`<div class="passed-badge">✅ 已学</div>`:`<button class="btn check-btn" onclick="openNodeQuizById('${n.id}')">🧪 学习成果检验</button>`):''}
    ${pts?`<div class="points"><h3>📌 关键要点</h3><ul>${pts}</ul></div>`:''}
    ${n.fun?`<div class="fun"><h3>✨ 有趣一点</h3><p>${n.fun}</p></div>`:''}
  `;
}
document.getElementById('detailClose').onclick=()=>{document.getElementById('detail').classList.remove('show');};

const search=document.getElementById('search');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  if(!q){flat.forEach(n=>{nodeEls[n.id].classList.remove('dim','match');});return;}
  flat.forEach(n=>{
    const text=((n.label||'')+' '+(n.title||'')+' '+(n.tag||'')+' '+(n.summary||'')+' '+(n.points||[]).join(' ')).toLowerCase();
    const hit=text.includes(q);
    nodeEls[n.id].classList.toggle('dim',!hit);
    nodeEls[n.id].classList.toggle('match',hit);
  });
});
document.getElementById('btnFit').onclick=fit;
document.getElementById('btnTheme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('ai-map-theme',next);
};
document.getElementById('btnReset').onclick=()=>{
  if(!confirm('确定清空学习进度和积分吗？')) return;
  visited=new Set();completed=new Set();passed=new Set();points=0;
  closeNodeQuiz();closeReward();
  localStorage.removeItem('ai-map-visited');
  localStorage.removeItem('ai-map-chapters');
  localStorage.removeItem('ai-map-passed');
  localStorage.removeItem('ai-map-points');
  renderTree();renderGraph();updateProgress();renderPoints();
};
function updateProgress(){
  const total=DATA.reduce((s,b)=>s+b.children.length,0);
  const done=[...passed].filter(id=>flat.some(n=>n.id===id&&n.level===2)).length;
  document.getElementById('progText').textContent=done+' / '+total;
  document.getElementById('progBar').style.width=(total?done/total*100:0)+'%';
}

/* 测验 */
let qi=0,score=0,answered=false;
function startQuiz(){qi=0;score=0;answered=false;document.getElementById('modal').classList.add('show');renderQ();}
function renderQ(){
  const card=document.getElementById('modalCard');
  if(qi>=QUIZ.length){
    const total=QUIZ.length, acc=score/total, pct=Math.round(acc*100);
    let bonus=0;
    if(acc>=0.8) bonus=QUIZ_BONUS;
    if(score===total) bonus+=50;
    const earned=score*QUIZ_PTS+bonus;
    addPoints(earned);
    const msg=acc>=0.8?'🏆 太强了，脉络已打通！':acc>=0.5?'💪 不错，继续多点点地图~':'🌱 再去地图里逛一圈再来挑战！';
    const ql=pickQuote();
    const quote=acc>=0.8?'':`<div class="tip">“${ql.text}” —— ${ql.author}${ql.source?' · '+ql.source:''}</div>`;
    card.innerHTML=`<h2>测验完成</h2><div class="sub">你的 AI 脉络分数 · 正确率 ${pct}%</div>
      <div class="score-big">${score} / ${total}</div><p class="hint">${msg}</p>
      <div class="reward-pts">本次获得 +${earned} 积分</div>
      ${quote}
      <div class="modal-foot"><button class="btn ghost" onclick="closeQuiz()">关闭</button>${acc>=0.8?`<button class="btn" onclick="quizReward(${pct},${earned})">🎁 查看鼓励卡</button>`:''}<button class="btn ghost" onclick="startQuiz()">再玩一次</button></div>`;
    if(acc>=0.8) setTimeout(()=>quizReward(pct,earned), 500);
    return;
  }
  const q=QUIZ[qi]; answered=false;
  card.innerHTML=`<h2>⚡ 小测验 ${qi+1}/${QUIZ.length}</h2><div class="sub">选一个答案，立即看解析</div>
    <div class="q">${q.q}</div><div class="opts" id="opts"></div>
    <div class="tip" id="tip" style="display:none"></div>
    <div class="modal-foot"><span class="hint">${qi+1} / ${QUIZ.length}</span><button class="btn" id="nextBtn" style="display:none">${qi===QUIZ.length-1?'看结果':'下一题'}</button></div>`;
  const opts=document.getElementById('opts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=String.fromCharCode(65+i)+'. '+o;
    b.onclick=()=>answer(i,b);
    opts.appendChild(b);
  });
  document.getElementById('nextBtn').onclick=()=>{qi++;renderQ();};
}
function answer(i,btn){
  if(answered) return; answered=true;
  const q=QUIZ[qi];
  const all=document.querySelectorAll('#opts .opt');
  all.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');});
  if(i===q.a){score++;btn.classList.add('correct');}else{btn.classList.add('wrong');}
  const tip=document.getElementById('tip');tip.style.display='block';tip.innerHTML='💡 '+q.tip;
  document.getElementById('nextBtn').style.display='inline-block';
}
function closeQuiz(){document.getElementById('modal').classList.remove('show');}
document.getElementById('btnQuiz').onclick=startQuiz;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeQuiz();});
window.addEventListener('resize',fit);
build();
</script>
</body>
